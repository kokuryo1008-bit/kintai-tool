<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | 勤怠管理システム</title>
  <link rel="stylesheet" href="/static/common.css?v=2">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
    </div>
    <h1 class="login-title">勤怠管理システム</h1>
    <p class="login-sub">社員IDとPINでサインインしてください</p>
    <div class="form-group">
      <label>社員ID</label>
      <input type="text" id="employee-id" placeholder="例: 001" autocomplete="username" inputmode="numeric" maxlength="10">
    </div>
    <div class="form-group">
      <label>PIN</label>
      <input type="password" id="password" placeholder="3桁のPIN" autocomplete="current-password" inputmode="numeric" maxlength="10">
    </div>
    <button class="btn-primary" id="login-btn" onclick="login()">サインイン</button>
    <div id="error-msg" class="error-msg hidden"></div>
    <div id="wakeup-msg" class="hidden" style="margin-top:16px;padding:14px 16px;background:var(--primary-bg);border:1px solid #BFDBFE;border-radius:10px;font-size:0.84rem;color:var(--primary-dark);line-height:1.55">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <svg class="icon" style="animation:spin 1.2s linear infinite;color:var(--primary)" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>
        <div id="wakeup-text" style="font-weight:600">サーバーを起動しています</div>
      </div>
      <div style="font-size:0.76rem;color:var(--text-muted);margin-bottom:8px">初回アクセスのため少しお時間を頂きます（最大60秒）</div>
      <div style="height:3px;background:#DBEAFE;border-radius:2px;overflow:hidden">
        <div id="progress-bar" style="height:100%;width:0%;background:var(--primary);border-radius:2px;transition:width 1s linear"></div>
      </div>
    </div>
    <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border);text-align:center;font-size:0.72rem;color:var(--text-subtle)">
      Powered by Kintai &middot; v2
    </div>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  <script>
    // 既存トークンがあれば自動ログイン
    (function() {
      const token = localStorage.getItem('token');
      const role  = localStorage.getItem('role');
      if (token && role) {
        location.replace((role === 'employee' ? '/employee' : '/admin') + '?_=' + Date.now());
      }
    })();

    let wakeupTimer = null;
    let progressTimer = null;
    let progressVal = 0;

    async function login() {
      const id = document.getElementById('employee-id').value.trim();
      const pw = document.getElementById('password').value;
      if (!id || !pw) { showError('社員IDとパスワードを入力してください。'); return; }

      hideError();
      setLoading(true);

      // 5秒後もまだ待っていたらスリープ起動中メッセージを表示
      wakeupTimer = setTimeout(() => showWakeup(), 5000);

      try {
        const res = await fetchWithRetry('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employee_id: id, password: pw })
        }, 90000); // 最大90秒待つ

        clearWakeup();
        const data = await res.json();
        if (!res.ok) { showError(data.detail); setLoading(false); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('name', data.name);
        localStorage.setItem('employee_id', data.employee_id);
        if (data.department_id) localStorage.setItem('department_id', data.department_id);
        const base = data.role === 'employee' ? '/employee' : '/admin';
        location.href = base + '?_=' + Date.now();
      } catch (e) {
        clearWakeup();
        setLoading(false);
        showError('サーバーに接続できません。時間をおいて再度お試しください。');
      }
    }

    // タイムアウト付きfetch（retryなし・1回で最大timeout ms待つ）
    function fetchWithRetry(url, opts, timeout) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('timeout')), timeout);
        fetch(url, opts)
          .then(res => { clearTimeout(timer); resolve(res); })
          .catch(err => { clearTimeout(timer); reject(err); });
      });
    }

    function showWakeup() {
      document.getElementById('wakeup-msg').classList.remove('hidden');
      // プログレスバー（60秒で100%）
      progressVal = 0;
      progressTimer = setInterval(() => {
        progressVal = Math.min(progressVal + 100/60, 99);
        document.getElementById('progress-bar').style.width = progressVal + '%';
        const sec = Math.round((100 - progressVal) * 60 / 100);
        document.getElementById('wakeup-text').textContent =
          sec > 0 ? `サーバーを起動中です... あと約${sec}秒` : 'もうすぐ起動します...';
      }, 1000);
    }

    function clearWakeup() {
      clearTimeout(wakeupTimer);
      clearInterval(progressTimer);
      document.getElementById('wakeup-msg').classList.add('hidden');
      document.getElementById('progress-bar').style.width = '0%';
    }

    function setLoading(loading) {
      const btn = document.getElementById('login-btn');
      btn.disabled = loading;
      btn.textContent = loading ? '接続中...' : 'サインイン';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-msg').classList.add('hidden');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
