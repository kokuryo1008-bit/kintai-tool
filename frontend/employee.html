<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>勤怠管理 | 従業員</title>
  <link rel="stylesheet" href="/static/common.css?v=2">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></span>
      Kintai
    </div>
    <div class="navbar-user" style="gap:6px;flex-wrap:wrap">
      <!-- 言語切替 -->
      <div style="display:flex;gap:2px;align-items:center;background:var(--bg-soft);padding:3px;border-radius:8px">
        <button class="lang-btn" data-lang="ja"  onclick="setLang('ja')"  style="padding:4px 9px;border-radius:6px;border:none;background:white;font-size:0.74rem;cursor:pointer;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)">日本語</button>
        <button class="lang-btn" data-lang="vi"  onclick="setLang('vi')"  style="padding:4px 9px;border-radius:6px;border:none;background:transparent;font-size:0.74rem;cursor:pointer;font-weight:500;color:var(--text-muted)">VN</button>
        <button class="lang-btn" data-lang="zh"  onclick="setLang('zh')"  style="padding:4px 9px;border-radius:6px;border:none;background:transparent;font-size:0.74rem;cursor:pointer;font-weight:500;color:var(--text-muted)">中文</button>
        <button class="lang-btn" data-lang="id"  onclick="setLang('id')"  style="padding:4px 9px;border-radius:6px;border:none;background:transparent;font-size:0.74rem;cursor:pointer;font-weight:500;color:var(--text-muted)">ID</button>
        <button class="lang-btn" data-lang="my"  onclick="setLang('my')"  style="padding:4px 9px;border-radius:6px;border:none;background:transparent;font-size:0.74rem;cursor:pointer;font-weight:500;color:var(--text-muted)">MY</button>
      </div>
      <a href="/manual" target="_blank" class="nav-link" data-i18n="nav_help">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        使い方
      </a>
      <span id="user-name"></span>
      <button class="btn-logout" onclick="logout()" data-i18n="nav_logout">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        ログアウト
      </button>
    </div>
  </nav>

  <div class="emp-container">
    <!-- 時刻カード -->
    <div class="clock-card">
      <div class="clock-time" id="current-time">--:--:--</div>
      <div class="clock-date" id="current-date"></div>
      <div class="clock-status" id="clock-status" data-i18n="status_loading">読み込み中...</div>
      <div id="today-shift" style="font-size:0.8rem;opacity:.8;margin-top:4px"></div>
      <div style="margin-top:16px;margin-bottom:8px">
        <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:0.85rem;opacity:.85">
          <input type="checkbox" id="toggle-trip" onchange="updateTripMode()" style="width:16px;height:16px;cursor:pointer">
          <span data-i18n="trip_mode">✈️ 出張中（GPS制限を解除）</span>
        </label>
      </div>
      <div class="clock-buttons">
        <button class="btn-clock btn-clock-in" id="btn-in" onclick="clockIn()" disabled data-i18n="btn_clock_in">出勤</button>
        <button class="btn-clock btn-clock-out" id="btn-out" onclick="clockOut()" disabled data-i18n="btn_clock_out">退勤</button>
      </div>
      <!-- 外出・帰社ボタン -->
      <div id="external-buttons" style="display:none;margin-top:12px;display:flex;gap:8px;justify-content:center">
        <button id="btn-go-out" onclick="goOut()" style="padding:10px 20px;border-radius:8px;border:2px solid #F59E0B;background:white;color:#D97706;font-weight:700;cursor:pointer;font-size:0.88rem" disabled data-i18n="btn_go_out">🚗 外出</button>
        <button id="btn-return" onclick="returnFromOut()" style="padding:10px 20px;border-radius:8px;border:2px solid #10B981;background:white;color:#059669;font-weight:700;cursor:pointer;font-size:0.88rem;display:none" data-i18n="btn_return">🏢 帰社</button>
      </div>
      <!-- 外出履歴（本日） -->
      <div id="external-log" style="margin-top:10px;font-size:0.78rem;color:rgba(255,255,255,.8)"></div>
    </div>

    <!-- GPS警告 -->
    <div id="gps-warning" class="card hidden" style="border-left:4px solid var(--warning);margin-bottom:12px">
      <div style="color:var(--warning);font-weight:600;margin-bottom:4px" data-i18n="gps_getting">📍 GPS取得中...</div>
      <div style="font-size:0.82rem;color:var(--text-muted)" data-i18n="gps_allow">位置情報を許可してください</div>
    </div>

    <!-- 本日の勤務情報 -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-title" data-i18n="card_today">📊 本日の勤務</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:#F8FAFC;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:var(--text-muted)" data-i18n="label_clock_in_time">出勤時刻</div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--accent)" id="disp-in">--:--</div>
        </div>
        <div style="background:#F8FAFC;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:var(--text-muted)" data-i18n="label_clock_out_time">退勤時刻</div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--danger)" id="disp-out">--:--</div>
        </div>
        <div style="background:#F8FAFC;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:var(--text-muted)" data-i18n="label_work_hours">勤務時間</div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--primary)" id="disp-work">--</div>
        </div>
        <div style="background:#FEF3C7;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:#92400E" data-i18n="label_overtime">残業時間</div>
          <div style="font-size:1.3rem;font-weight:800;color:#D97706" id="disp-ot">--</div>
        </div>
      </div>
    </div>

    <!-- タブ -->
    <div class="card">
      <div class="tabs" style="overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch">
        <button class="tab-btn active" onclick="showTab('history')" style="white-space:nowrap" data-i18n="tab_history">勤務履歴</button>
        <button class="tab-btn" onclick="showTab('shift')" style="white-space:nowrap" data-i18n="tab_shift">シフト表</button>
        <button class="tab-btn" onclick="showTab('leave')" style="white-space:nowrap" data-i18n="tab_leave">有給申請</button>
        <button class="tab-btn" onclick="showTab('report')" style="white-space:nowrap" data-i18n="tab_report">日報</button>
        <button class="tab-btn" onclick="showTab('sales')" style="white-space:nowrap" data-i18n="tab_sales">営業報告</button>
        <button class="tab-btn" onclick="showTab('overtime')" style="white-space:nowrap" data-i18n="tab_overtime">残業申請</button>
        <button class="tab-btn" onclick="showTab('correction')" style="white-space:nowrap" data-i18n="tab_correction">打刻修正申請</button>
      </div>

      <!-- シフト表 -->
      <div id="tab-shift" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
          <!-- 表示モード切替 -->
          <div style="display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0">
            <button id="shift-btn-week" onclick="setShiftView('weekly')" style="padding:7px 14px;border:none;background:var(--primary);color:white;cursor:pointer;font-weight:700;font-size:0.82rem" data-i18n="btn_week_view">今日から7日</button>
            <button id="shift-btn-month" onclick="setShiftView('monthly')" style="padding:7px 14px;border:none;background:white;color:var(--text-muted);cursor:pointer;font-weight:700;font-size:0.82rem" data-i18n="btn_month_view">月表示</button>
          </div>
          <!-- 月表示コントロール（月モード時のみ） -->
          <div id="shift-monthly-ctrl" style="display:none;gap:8px;align-items:center">
            <select id="shift-emp-year" style="width:auto"></select>
            <select id="shift-emp-month" style="width:auto"></select>
            <button class="btn-outline btn-sm" onclick="loadShiftTable()" data-i18n="btn_show">表示</button>
          </div>
          <button class="btn-outline btn-sm" onclick="exportShiftExcel()" style="margin-left:auto;border-color:var(--accent);color:var(--accent)" data-i18n="btn_excel">📥 Excel出力</button>
        </div>
        <div id="shift-status" style="text-align:center;color:var(--text-muted);padding:20px;font-size:0.88rem"></div>
        <div style="overflow-x:auto">
          <table id="shift-emp-table" style="font-size:0.78rem;border-collapse:collapse;width:100%">
            <thead id="shift-emp-thead"></thead>
            <tbody id="shift-emp-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 勤務履歴 -->
      <div id="tab-history">
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
          <select id="hist-year" style="width:auto"></select>
          <select id="hist-month" style="width:auto"></select>
          <button class="btn-outline btn-sm" onclick="loadHistory()" data-i18n="btn_show">表示</button>
        </div>
        <div style="background:#EFF6FF;border-radius:8px;padding:10px 14px;margin-bottom:6px;font-size:0.85rem;display:flex;gap:20px;flex-wrap:wrap">
          <span><span data-i18n="summary_work">勤務</span>: <strong id="sum-work">--</strong></span>
          <span><span data-i18n="summary_ot">残業</span>: <strong id="sum-ot">--</strong></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th data-i18n="col_date">日付</th><th data-i18n="col_clock_in_h">出勤</th><th data-i18n="col_clock_out_h">退勤</th><th data-i18n="col_work_h">勤務</th><th data-i18n="col_ot_h">残業</th></tr></thead>
            <tbody id="hist-body"></tbody>
          </table>
        </div>
      </div>

      <!-- 日報 -->
      <div id="tab-report" class="hidden">
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
          <select id="rep-year" style="width:auto"></select>
          <select id="rep-month" style="width:auto"></select>
          <button class="btn-outline btn-sm" onclick="loadReport()">表示</button>
          <button class="btn-primary" style="width:auto;padding:8px 16px;font-size:0.85rem;margin-left:auto" onclick="openReportModal()">＋ 行を追加</button>
        </div>
        <div style="overflow-x:auto">
          <table id="report-table" style="min-width:640px;font-size:0.78rem">
            <thead>
              <tr>
                <th rowspan="2" style="min-width:64px">日付</th>
                <th colspan="3" style="background:#EFF6FF;color:var(--primary)">基板</th>
                <th colspan="2" style="background:#F0FDF4;color:#059669">その他</th>
                <th rowspan="2" style="min-width:60px"></th>
              </tr>
              <tr>
                <th style="background:#EFF6FF;min-width:110px">品番 / 見積No</th>
                <th style="background:#EFF6FF;min-width:80px">作業内容</th>
                <th style="background:#EFF6FF;min-width:90px">開始〜終了</th>
                <th style="background:#F0FDF4;min-width:80px">作業内容</th>
                <th style="background:#F0FDF4;min-width:90px">開始〜終了</th>
              </tr>
            </thead>
            <tbody id="report-body"></tbody>
            <tfoot id="report-foot"></tfoot>
          </table>
        </div>
      </div>

      <!-- 営業報告 -->
      <div id="tab-sales" class="hidden">
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
          <select id="sale-year" style="width:auto"></select>
          <select id="sale-month" style="width:auto"></select>
          <button class="btn-outline btn-sm" onclick="loadSales()">表示</button>
          <button class="btn-primary" style="width:auto;padding:8px 16px;font-size:0.85rem;margin-left:auto" onclick="openSalesModal()">＋ 新規入力</button>
        </div>
        <div id="sales-list"></div>
      </div>

      <!-- 残業申請 -->
      <div id="tab-overtime" class="hidden">
        <div style="background:#FEF3C7;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.82rem;color:#92400E" data-i18n="ot_note">
          残業申請は各部署の管理職が行います。申請状況の確認のみ可能です。
        </div>
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
          <select id="ot-year" style="width:auto"></select>
          <select id="ot-month" style="width:auto"></select>
          <button class="btn-outline btn-sm" onclick="loadOvertime()">表示</button>
        </div>
        <div id="overtime-list"></div>
      </div>

      <!-- 打刻修正申請 -->
      <div id="tab-correction" style="display:none">
        <div style="background:#FEF3C7;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:0.85rem;color:#92400E" data-i18n="corr_desc">
          打刻の修正が必要な場合はこちらから申請してください。管理者が確認・承認します。
        </div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-title" data-i18n="corr_title">📝 新規申請</div>
          <div class="form-group"><label data-i18n="corr_date">対象日</label><input type="date" id="corr-date"></div>
          <div style="display:flex;gap:12px;margin-bottom:12px">
            <div class="form-group" style="margin:0;flex:1"><label data-i18n="corr_in">修正後 出勤時刻</label><input type="time" id="corr-in"></div>
            <div class="form-group" style="margin:0;flex:1"><label data-i18n="corr_out">修正後 退勤時刻</label><input type="time" id="corr-out"></div>
          </div>
          <div class="form-group"><label data-i18n="corr_reason">理由</label><input type="text" id="corr-reason" placeholder="例：打刻忘れのため"></div>
          <button class="btn-primary" onclick="submitCorrection()" data-i18n="btn_apply">申請する</button>
        </div>
        <div class="card">
          <div class="card-title" data-i18n="corr_history">申請履歴</div>
          <div id="correction-history"></div>
        </div>
      </div>

      <!-- 有給申請 -->
      <div id="tab-leave" class="hidden">
        <div style="background:#D1FAE5;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:0.88rem">
          <span data-i18n="leave_remaining">有給残数</span>: <strong id="leave-remaining" style="font-size:1.1rem;color:var(--accent)">--</strong><span data-i18n="leave_remaining_unit"> 日</span>
        </div>
        <div class="form-group"><label data-i18n="label_start_date">開始日</label><input type="date" id="leave-start"></div>
        <div class="form-group"><label data-i18n="label_end_date">終了日</label><input type="date" id="leave-end"></div>
        <div class="form-group"><label data-i18n="label_days">取得日数</label><input type="number" id="leave-days" min="0.5" step="0.5" placeholder="例: 1"></div>
        <div class="form-group"><label data-i18n="label_reason">理由（任意）</label><input type="text" id="leave-reason" placeholder="例: 私用のため"></div>
        <button class="btn-primary" onclick="submitLeave()" data-i18n="btn_apply">申請する</button>
        <div style="margin-top:16px">
          <div style="font-weight:600;font-size:0.88rem;color:var(--text-muted);margin-bottom:8px" data-i18n="leave_history_title">申請履歴</div>
          <div id="leave-history"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- 日報 行追加・編集モーダル -->
  <div id="report-modal" class="modal-overlay hidden">
    <div class="modal" style="max-width:480px">
      <div class="modal-title" id="report-modal-title">日報 行追加</div>
      <input type="hidden" id="rep-entry-id">
      <div class="form-group"><label>日付</label><input type="date" id="rep-date"></div>
      <div style="background:#EFF6FF;border-radius:8px;padding:12px;margin-bottom:12px">
        <div style="font-weight:700;font-size:0.85rem;color:var(--primary);margin-bottom:10px">基板</div>
        <div class="form-group" style="margin-bottom:8px"><label>品番</label><input type="text" id="rep-part" placeholder="例: PCB-001"></div>
        <div class="form-group" style="margin-bottom:8px"><label>見積No</label><input type="text" id="rep-est" placeholder="例: Q-001"></div>
        <div class="form-group" style="margin-bottom:8px"><label>作業内容（A〜N）</label><select id="rep-work-code" style="width:100%"></select></div>
        <div style="display:flex;gap:8px">
          <div class="form-group" style="margin:0;flex:1"><label>開始</label><input type="time" id="rep-board-start"></div>
          <div class="form-group" style="margin:0;flex:1"><label>終了</label><input type="time" id="rep-board-end"></div>
        </div>
      </div>
      <div style="background:#F0FDF4;border-radius:8px;padding:12px;margin-bottom:16px">
        <div style="font-weight:700;font-size:0.85rem;color:#059669;margin-bottom:10px">その他</div>
        <div class="form-group" style="margin-bottom:8px"><label>作業内容（A〜O）</label><select id="rep-other-code" style="width:100%"></select></div>
        <div style="display:flex;gap:8px">
          <div class="form-group" style="margin:0;flex:1"><label>開始</label><input type="time" id="rep-other-start"></div>
          <div class="form-group" style="margin:0;flex:1"><label>終了</label><input type="time" id="rep-other-end"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeReportModal()">キャンセル</button>
        <button class="btn-primary" style="width:auto;padding:10px 24px" onclick="saveReport()">保存</button>
      </div>
    </div>
  </div>

  <!-- 営業報告 モーダル -->
  <div id="sales-modal" class="modal-overlay hidden">
    <div class="modal" style="max-width:480px">
      <div class="modal-title" id="sales-modal-title">営業報告 入力</div>
      <input type="hidden" id="sale-entry-id">
      <div class="form-group"><label>日付</label><input type="date" id="sale-date"></div>
      <div class="form-group"><label>会社名 <span style="color:var(--danger)">*</span></label><input type="text" id="sale-company" placeholder="例: 株式会社ABC"></div>
      <div class="form-group"><label>担当部署</label><input type="text" id="sale-dept" placeholder="例: 購買部"></div>
      <div class="form-group"><label>担当者名</label><input type="text" id="sale-person" placeholder="例: 山田 太郎"></div>
      <div class="form-group"><label>訪問目的</label><input type="text" id="sale-purpose" placeholder="例: 新規提案"></div>
      <div class="form-group"><label>話の内容</label><textarea id="sale-content" rows="3" placeholder="商談内容・要件など" style="width:100%;resize:vertical"></textarea></div>
      <div class="form-group"><label>金額（円）</label><input type="number" id="sale-amount" min="0" placeholder="例: 500000"></div>
      <div class="form-group"><label>ステータス</label>
        <select id="sale-status" style="width:100%">
          <option value="商談中">商談中</option>
          <option value="提案済">提案済</option>
          <option value="受注">受注</option>
          <option value="失注">失注</option>
          <option value="保留">保留</option>
        </select>
      </div>
      <div class="form-group"><label>次回アクション</label><input type="text" id="sale-next-action" placeholder="例: 見積書送付"></div>
      <div class="form-group"><label>次回予定日</label><input type="date" id="sale-next-date"></div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeSalesModal()">キャンセル</button>
        <button class="btn-primary" style="width:auto;padding:10px 24px" onclick="saveSales()">保存</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="/static/i18n.js?v=5"></script>
  <script src="/static/employee.js?v=13"></script>
  <script>
    // 言語切替UIのアクティブ状態を更新
    (function patchLang(){
      const orig = window.setLang;
      if (typeof orig === 'function') {
        window.setLang = function(lang){
          orig(lang);
          document.querySelectorAll('.lang-btn').forEach(b => {
            const active = b.dataset.lang === lang;
            b.style.background = active ? 'white' : 'transparent';
            b.style.fontWeight = active ? '600' : '500';
            b.style.color = active ? 'var(--ink)' : 'var(--text-muted)';
            b.style.boxShadow = active ? '0 1px 2px rgba(0,0,0,.06)' : 'none';
          });
        };
        // 初期状態の同期
        const cur = localStorage.getItem('lang') || 'ja';
        window.setLang(cur);
      }
    })();
  </script>
</body>
</html>
