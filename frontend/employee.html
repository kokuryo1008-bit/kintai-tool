<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>勤怠管理 | 従業員</title>
  <link rel="stylesheet" href="/static/common.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">🕐 勤怠管理</div>
    <div class="navbar-user">
      <span id="user-name"></span>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </nav>

  <div class="emp-container">
    <!-- 時刻カード -->
    <div class="clock-card">
      <div class="clock-time" id="current-time">--:--:--</div>
      <div class="clock-date" id="current-date"></div>
      <div class="clock-status" id="clock-status">読み込み中...</div>
      <div style="margin-top:16px;margin-bottom:8px">
        <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:0.85rem;opacity:.85">
          <input type="checkbox" id="toggle-trip" onchange="updateTripMode()" style="width:16px;height:16px;cursor:pointer">
          ✈️ 出張中（GPS制限を解除）
        </label>
      </div>
      <div class="clock-buttons">
        <button class="btn-clock btn-clock-in" id="btn-in" onclick="clockIn()" disabled>出勤</button>
        <button class="btn-clock btn-clock-out" id="btn-out" onclick="clockOut()" disabled>退勤</button>
      </div>
    </div>

    <!-- GPS警告 -->
    <div id="gps-warning" class="card hidden" style="border-left:4px solid var(--warning);margin-bottom:12px">
      <div style="color:var(--warning);font-weight:600;margin-bottom:4px">📍 GPS取得中...</div>
      <div style="font-size:0.82rem;color:var(--text-muted)">位置情報を許可してください</div>
    </div>

    <!-- 本日の勤務情報 -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">📊 本日の勤務</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:#F8FAFC;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:var(--text-muted)">出勤時刻</div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--accent)" id="disp-in">--:--</div>
        </div>
        <div style="background:#F8FAFC;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:var(--text-muted)">退勤時刻</div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--danger)" id="disp-out">--:--</div>
        </div>
        <div style="background:#F8FAFC;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:var(--text-muted)">勤務時間</div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--primary)" id="disp-work">--</div>
        </div>
        <div style="background:#FEF3C7;border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:0.75rem;color:#92400E">残業時間</div>
          <div style="font-size:1.3rem;font-weight:800;color:#D97706" id="disp-ot">--</div>
        </div>
      </div>
    </div>

    <!-- タブ -->
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('history')">勤務履歴</button>
        <button class="tab-btn" onclick="showTab('leave')">有給申請</button>
      </div>

      <!-- 勤務履歴 -->
      <div id="tab-history">
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
          <select id="hist-year" style="width:auto"></select>
          <select id="hist-month" style="width:auto"></select>
          <button class="btn-outline btn-sm" onclick="loadHistory()">表示</button>
        </div>
        <div style="background:#EFF6FF;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:0.85rem;display:flex;gap:20px">
          <span>勤務: <strong id="sum-work">--</strong></span>
          <span>残業: <strong id="sum-ot" style="color:var(--warning)">--</strong></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>日付</th><th>出勤</th><th>退勤</th><th>勤務</th><th>残業</th></tr></thead>
            <tbody id="hist-body"></tbody>
          </table>
        </div>
      </div>

      <!-- 有給申請 -->
      <div id="tab-leave" class="hidden">
        <div style="background:#D1FAE5;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:0.88rem">
          有給残数: <strong id="leave-remaining" style="font-size:1.1rem;color:var(--accent)">--</strong> 日
        </div>
        <div class="form-group"><label>開始日</label><input type="date" id="leave-start"></div>
        <div class="form-group"><label>終了日</label><input type="date" id="leave-end"></div>
        <div class="form-group"><label>取得日数</label><input type="number" id="leave-days" min="0.5" step="0.5" placeholder="例: 1"></div>
        <div class="form-group"><label>理由（任意）</label><input type="text" id="leave-reason" placeholder="例: 私用のため"></div>
        <button class="btn-primary" onclick="submitLeave()">申請する</button>
        <div style="margin-top:16px">
          <div style="font-weight:600;font-size:0.88rem;color:var(--text-muted);margin-bottom:8px">申請履歴</div>
          <div id="leave-history"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/employee.js"></script>
</body>
</html>
