services:
  - type: web
    name: kintai-tool
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: kintai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
